name: SEO validation

on:
  push:
    branches: ["Index"]
  pull_request:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run SEO / technical-hygiene checks
        run: python3 scripts/seo_check.py
